# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout (with vcpkg submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install & activate Emscripten (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone https://github.com/emscripten-core/emsdk.git emsdk
          ./emsdk/emsdk install latest
          ./emsdk/emsdk activate latest
          echo "${{ github.workspace }}/emsdk" >> $GITHUB_PATH
          echo "${{ github.workspace }}/emsdk/upstream/emscripten" >> $GITHUB_PATH

      - name: Install & activate Emscripten (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/emscripten-core/emsdk.git emsdk
          .\emsdk\emsdk.bat install latest
          .\emsdk\emsdk.bat activate latest
          # Persist emsdk on PATH for ALL future steps
          Add-Content -Path $Env:GITHUB_PATH -Value "$Env:GITHUB_WORKSPACE\emsdk"
          Add-Content -Path $Env:GITHUB_PATH -Value "$Env:GITHUB_WORKSPACE\emsdk\upstream\emscripten"

      - name: Verify tools
        run: |
          emcc --version
          em++ --version
          python --version

      - name: Build WASM wrapper
        run: python lib3mf_emscripten_bindings_build.py --build-type Release --out-dir build

      - name: Verify outputs (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -f build/lib3mfEmscriptenTest.js
          test -f build/lib3mfEmscriptenTest.wasm

      - name: Verify outputs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path build/lib3mfEmscriptenTest.js)) { throw "Missing .js" }
          if (-not (Test-Path build/lib3mfEmscriptenTest.wasm)) { throw "Missing .wasm" }